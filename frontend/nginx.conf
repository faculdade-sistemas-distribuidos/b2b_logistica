server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: servir sob /logistica/ com fallback para index.html
    # O Load Balancer externo roteia /logistica/ → este container na porta 80
    location /logistica/ {
        try_files $uri $uri/ /logistica/index.html;
    }

    # Fallback raiz (redireciona para /logistica/)
    location = / {
        return 302 /logistica/;
    }

    # Docker embedded DNS — resolução dinâmica de nomes de container
    resolver 127.0.0.11 valid=30s;

    # Proxy API requests to the backend service
    location /api/logistica/ {
        set $backend "http://logistica-service:5008";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
